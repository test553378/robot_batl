<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2240">
  <meta name="description" content="はたらくくるまのパーツでロボットをつくって、3かいのバトルにちょうせん！">
  <title>レスキューメカ・バトル</title>
  <script>
    window.addEventListener('error', (event) => {
      if (!(event.target instanceof HTMLScriptElement) || event.target.type !== 'module') return
      const showError = () => {
        const loading = document.querySelector('.boot')
        const failure = document.querySelector('#load-failure')
        if (loading && failure) {
          loading.remove()
          failure.hidden = false
        }
      }
      if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', showError, { once: true })
      else showError()
    }, true)
  </script>
</head>
<body>
  <main id="game">
    <div id="view"></div>
    <div id="ui">
      <div class="boot" role="status">
        <p>ロボットを よんでいるよ…</p>
        <progress aria-label="よみこみ" max="3" value="1"></progress>
      </div>
      <div id="load-failure" class="screen-error" role="alert" hidden>
        <h1>ゲームを よめなかったよ</h1>
        <button class="primary" onclick="location.reload()">もういちど</button>
      </div>
    </div>
  </main>
  <noscript>あそぶには JavaScript をオンにしてね。</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
